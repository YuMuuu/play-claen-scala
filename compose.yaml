services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: play_clean
      POSTGRES_USER: play_clean
      POSTGRES_PASSWORD: play_clean
    ports:
      - "5432:5432"
    volumes:
      - ./modules/bootstrap/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U play_clean -d play_clean"]
      interval: 2s
      timeout: 2s
      retries: 15
