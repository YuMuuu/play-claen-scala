pekko {
  actor.daemonic = off

  http.server.termination-deadline = 10 s

  actor.coordinated-shutdown.phases {
    service-unbind.timeout = 10 s
    service-stop.timeout = 10 s
  }
}

app {
  server {
    host = "0.0.0.0"
    host = ${?SERVER_HOST}
    port = 8080
    port = ${?SERVER_PORT}
    graceful-shutdown-timeout = 10 s
    graceful-shutdown-timeout = ${?GRACEFUL_SHUTDOWN_TIMEOUT}
  }

  database {
    url = "jdbc:postgresql://localhost:5432/play_clean"
    url = ${?DATABASE_URL}
    user = "play_clean"
    user = ${?DATABASE_USER}
    password = "play_clean"
    password = ${?DATABASE_PASSWORD}
  }

  mock-auth {
    access-token = "mock-access-token"
    access-token = ${?MOCK_ACCESS_TOKEN}
    user-id = "mock-test-id"
    user-name = "mock-test-user"
  }
}
