pekko {
  actor.daemonic = off
}

# データベースアクセスのようにブロッキングする処理を default の ExecutionContext から分離するための
# dispatcher。CustomExecutionContext が名前で参照する。接続を同時に取得できる数を超えて thread を
# 増やしても待ち時間が増えるだけなので、fixed-pool-size は HikariCP の maximum-pool-size に合わせる。
database-dispatcher {
  type = "Dispatcher"
  executor = "thread-pool-executor"
  throughput = 1

  thread-pool-executor {
    fixed-pool-size = 10
    fixed-pool-size = ${?DATABASE_DISPATCHER_POOL_SIZE}
  }
}

app {
  server {
    host = "0.0.0.0"
    host = ${?SERVER_HOST}
    port = 8080
    port = ${?SERVER_PORT}
    graceful-shutdown-timeout = 10 s
    graceful-shutdown-timeout = ${?GRACEFUL_SHUTDOWN_TIMEOUT}
  }

  database {
    url = "jdbc:postgresql://localhost:5432/play_clean"
    url = ${?DATABASE_URL}
    user = "play_clean"
    user = ${?DATABASE_USER}
    password = "play_clean"
    password = ${?DATABASE_PASSWORD}
  }

  mock-auth {
    access-token = "mock-access-token"
    access-token = ${?MOCK_ACCESS_TOKEN}
    user-id = "mock-test-id"
    user-name = "mock-test-user"
  }
}
